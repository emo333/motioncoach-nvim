name: Neovim Plugin Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: sudo apt-get install -y neovim
      - name: Install Plenary.nvim
        run: git clone --depth=1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/test/start/plenary.nvim
      - name: Install Luarocks and luacov
        run: sudo apt-get install -y luarocks && luarocks install luacov
      - name: Run Tests with Coverage
        run: |
          export LUA_PATH=';;./lua/?.lua'
          luacov runner -- nvim --headless -c "PlenaryBustedDirectory spec/" > test-log.txt
      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: test-outputs
          path: |
            test-log.txt
            luacov.stats.out
